<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f7f4ef">
  <title>めじるしイニシャルキーホルダー</title>
  <link rel="stylesheet" href="styles.css?v=20260924-1">
</head>
<body>
  <main>
    <header><p class="eyebrow">ORIGINAL KEYHOLDER</p><h1>めじるし<br>イニシャルキーホルダー</h1><p>かたち・イニシャル・アクリル板を選んでね</p></header>
    <section class="layout">
      <div class="preview-card">
        <div id="preview" class="preview" aria-label="完成イメージ"><div id="previewFrame" class="fallback-shape"><span id="previewInitial">A</span></div><span class="preview-charm-card"><img id="previewCharm" alt="チャーム"></span></div>
        <dl><div><dt>受付番号</dt><dd id="ticket"></dd></div><div><dt>ニックネーム</dt><dd id="nicknamePreview">未入力</dd></div><div><dt>えらんだもの</dt><dd id="summary"></dd></div></dl>
      </div>
      <div class="steps">
        <section><h2><b>1</b> ニックネームを入力</h2><label class="nickname-field">ニックネーム<input id="nickname" type="text" maxlength="20" autocomplete="off" placeholder="例：はなこ" required></label><p class="input-note">保存ファイル名に使用します（20文字まで）</p></section>
        <section><h2><b>2</b> かたちを選ぶ</h2><div id="frames" class="choice-grid frames"></div></section>
        <section><h2><b>3</b> イニシャルを選ぶ</h2><div id="letters" class="choice-grid letters"></div></section>
        <section><h2><b>4</b> アクリル板を選ぶ</h2><div id="colorTabs" class="tabs"></div><div id="colors" class="choice-grid colors"></div></section>
        <section><h2><b>5</b> チャームの色を選ぶ</h2><div id="charms" class="choice-grid charms"></div></section>
        <button id="done" class="primary">これで決定！</button>
      </div>
    </section>
  </main>
      <dialog id="doneDialog"><div class="dialog-card"><h2>できあがり！</h2><div id="donePreview" class="dialog-preview"></div><p id="doneSummary"></p><p>この画面のままスタッフに渡してください。</p><details><summary>スタッフ用</summary><label id="staffPassLabel">合言葉<input id="staffPass" type="password"></label><button id="unlock">開く</button><div id="staffActions" hidden><button id="downloadSvg">加工用SVG</button><button id="downloadPreview">プレビュー画像を端末に保存</button><button id="sendDrive">加工用SVGをDriveへ保存・在庫を減らす</button><p id="status" role="status" aria-live="polite"></p><button id="toggleInventory" type="button">在庫管理をする</button><section id="inventoryPanel" class="inventory-panel" hidden><h3>在庫管理</h3><p>補充・数え直しの際に＋／－で調整してください。</p><div id="inventory"></div></section><button id="next" class="secondary">次の人へ</button></div></details><button id="edit" class="secondary">選び直す</button></div></dialog>
  <script src="app.js?v=20260925-5"></script>
</body>
</html>
