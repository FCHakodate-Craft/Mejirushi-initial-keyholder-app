<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f7f4ef">
  <title>めじるしイニシャルキーホルダー</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main>
    <header><p class="eyebrow">ORIGINAL KEYHOLDER</p><h1>めじるし<br>イニシャルキーホルダー</h1><p>かたち・イニシャル・アクリル板を選んでね</p></header>
    <section class="layout">
      <div class="preview-card">
        <div id="preview" class="preview" aria-label="完成イメージ"><div id="previewFrame" class="fallback-shape"><span id="previewInitial">A</span></div><i id="previewCharm"></i></div>
        <dl><div><dt>受付番号</dt><dd id="ticket"></dd></div><div><dt>えらんだもの</dt><dd id="summary"></dd></div></dl>
      </div>
      <div class="steps">
        <section><h2><b>1</b> かたちを選ぶ</h2><div id="frames" class="choice-grid frames"></div></section>
        <section><h2><b>2</b> イニシャルを選ぶ</h2><div id="letters" class="choice-grid letters"></div></section>
        <section><h2><b>3</b> アクリル板を選ぶ</h2><div id="colorTabs" class="tabs"></div><div id="colors" class="choice-grid colors"></div></section>
        <button id="done" class="primary">これで決定！</button>
      </div>
    </section>
  </main>
      <dialog id="doneDialog"><div class="dialog-card"><h2>できあがり！</h2><div id="donePreview" class="dialog-preview"></div><p id="doneSummary"></p><p>この画面のままスタッフに渡してください。</p><details><summary>スタッフ用</summary><label>合言葉<input id="staffPass" type="password"></label><button id="unlock">開く</button><div id="staffActions" hidden><button id="downloadSvg">加工用SVG</button><button id="downloadProof">確認用データ</button><button id="sendDrive">Driveへ保存</button><button id="next" class="secondary">次の人へ</button></div><p id="status"></p></details><button id="edit" class="secondary">選び直す</button></div></dialog>
  <script src="app.js"></script>
</body>
</html>
